[project]
name = "dsa-sensei"
version = "0.1.0"
description = "Socratic DSA interview tutor: hint ladders, complexity feedback, and spaced repetition."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Aravind Pilla" }]
keywords = [
    "dsa",
    "algorithms",
    "data-structures",
    "interview-prep",
    "spaced-repetition",
    "socratic",
    "mcp",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=2.3,<3",
    "rich>=13.7",
    "typer>=0.12.5",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
]

[project.scripts]
dsa-sensei = "dsa_sensei.cli:main"

[project.urls]
Homepage = "https://github.com/krish9219/dsa-sensei"
Repository = "https://github.com/krish9219/dsa-sensei"
Changelog = "https://github.com/krish9219/dsa-sensei/blob/main/CHANGELOG.md"
Issues = "https://github.com/krish9219/dsa-sensei/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dsa_sensei"]

[tool.ruff]
target-version = "py310"
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Typer options are the documented way to declare CLI flags.
"src/dsa_sensei/cli.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["dsa_sensei"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["dsa_sensei"]
warn_unreachable = true
pretty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=dsa_sensei --cov-report=term-missing"
pythonpath = ["src"]

[tool.coverage.run]
source = ["dsa_sensei"]
omit = ["src/dsa_sensei/__main__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
